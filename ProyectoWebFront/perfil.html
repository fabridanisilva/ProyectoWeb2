<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Social - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="feed.html">🔥 intagran</a>
            <div class="d-flex align-items-center">
                <button class="btn btn-success btn-sm me-2" data-bs-toggle="modal" data-bs-target="#modalPublicacion">+ Nueva Foto</button>
                <a href="buscar.html" class="btn btn-outline-info btn-sm me-3">🔍 Buscar</a>
                <a href="feed.html" class="btn btn-outline-light btn-sm me-3">Volver al Feed</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 mb-4 bg-white">
                    <div class="card-body text-center py-5">
                        <h2 class="fw-bold mb-1" id="perfilUsername">@Cargando...</h2>
                        <p class="text-muted mb-4" id="perfilNombreCompleto">Cargando datos...</p>
                        
                        <div class="d-flex justify-content-center mb-4 gap-4">
                            <div class="text-center">
                                <h4 class="fw-bold mb-0" id="countPublicaciones">0</h4>
                                <span class="text-muted small">Publicaciones</span>
                            </div>
                            <div class="text-center">
                                <h4 class="fw-bold mb-0" id="countSeguidores">0</h4>
                                <span class="text-muted small">Seguidores</span>
                            </div>
                            <div class="text-center">
                                <h4 class="fw-bold mb-0" id="countSeguidos">0</h4>
                                <span class="text-muted small">Seguidos</span>
                            </div>
                        </div>

                        <button id="btnSeguirPerfil" class="btn btn-primary px-4 d-none">Seguir</button>
                    </div>
                </div>

                <h4 class="mb-3 fw-bold">Publicaciones</h4>
                
                <div class="row" id="contenedorPerfilPublicaciones">
                    </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="modalPublicacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Crear Publicación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formPublicacion">
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" id="pubTitulo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea id="pubDescripcion" class="form-control" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL de la Imagen</label>
                            <input type="url" id="pubImagen" class="form-control" placeholder="https://ejemplo.com/foto.jpg" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Etiquetas (separadas por coma)</label>
                            <input type="text" id="pubEtiquetas" class="form-control" placeholder="ej: java, programacion, viaje">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Publicar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
