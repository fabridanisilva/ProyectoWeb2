<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Social - Buscar Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="feed.html">🔥intagran</a>
            <div class="d-flex align-items-center">
                <a href="perfil.html" class="btn btn-outline-warning btn-sm me-3">👤 Mi Perfil</a>
                <a href="feed.html" class="btn btn-outline-light btn-sm me-3">Volver al Feed</a>
                <span class="text-white" id="nombreUsuario">Cargando...</span>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h4 class="mb-3">Encontrar amigos</h4>
                        <form id="formBuscar" class="d-flex">
                            <input type="text" id="inputBusqueda" class="form-control me-2" placeholder="Buscar por nombre o usuario..." required>
                            <button type="submit" class="btn btn-primary fw-bold">Buscar</button>
                        </form>
                    </div>
                </div>

                <div id="contenedorResultados">
                    </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/buscar.js"></script>
</body>
</html>
